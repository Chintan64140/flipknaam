  <!-- Global Cache Management System -->
  <script>
    // Global cache management variables
    window.cacheManager = {
      currentCacheVersion: null,
      storedCacheVersion: null,
      
      // Check cache version and clear localStorage if needed
      checkCacheVersion: function() {
        const self = this;
        $.ajax({
          url: '/api/cache-version.php',
          method: 'GET',
          success: function (data) {
            if (data.success && data.cache_versions) {
              // Check products cache version
              if (data.cache_versions.products) {
                self.currentCacheVersion = data.cache_versions.products.version;
                self.storedCacheVersion = localStorage.getItem('products_cache_version');
                
                // If cache version has changed, clear localStorage
                if (self.storedCacheVersion && self.storedCacheVersion != self.currentCacheVersion) {
                  console.log('🔄 Products cache version changed from', self.storedCacheVersion, 'to', self.currentCacheVersion);
                  self.clearLocalStorage();
                }
                
                // Store current cache version
                localStorage.setItem('products_cache_version', self.currentCacheVersion);
              }
              
              // Check homepage products cache version
              if (data.cache_versions.homepage_products) {
                const homepageCacheVersion = data.cache_versions.homepage_products.version;
                const storedHomepageCacheVersion = localStorage.getItem('homepage_products_cache_version');
                
                // If homepage products cache version has changed, clear localStorage
                if (storedHomepageCacheVersion && storedHomepageCacheVersion != homepageCacheVersion) {
                  console.log('🔄 Homepage products cache version changed from', storedHomepageCacheVersion, 'to', homepageCacheVersion);
                  self.clearLocalStorage();
                }
                
                // Store current homepage cache version
                localStorage.setItem('homepage_products_cache_version', homepageCacheVersion);
              }
            }
          },
          error: function (error) {
            console.error('❌ Error checking cache version:', error);
          }
        });
      },
      
      // Clear localStorage function
      clearLocalStorage: function() {
        if (typeof(Storage) !== "undefined") {
          // IMPORTANT: DO NOT clear cart data - only clear cache versions
          // localStorage.removeItem("cartData"); // REMOVED - Cart should persist
          // localStorage.removeItem("cart"); // REMOVED - Cart should persist
          localStorage.removeItem("products_cache_version");
          localStorage.removeItem("homepage_products_cache_version");
          
          // Only clear cache-related keys, NOT cart or address data
          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            // Only remove cache-related keys, preserve cart and address data
            if (key && (key.includes("cache") || key.includes("Cache")) && !key.includes("cart") && !key.includes("Cart")) {
              keysToRemove.push(key);
            }
          }
          keysToRemove.forEach(key => localStorage.removeItem(key));
          
          console.log('🧹 Cache cleared (cart data preserved)');
          
          // Show notification to user
          self.showNotification('🔄 Fresh data loaded!', 'success');
        }
      },
      
      // Update cache version from API response
      updateCacheVersion: function(version) {
        if (version) {
          this.currentCacheVersion = version;
          localStorage.setItem('products_cache_version', version);
        }
      },
      
      // Simple notification system
      showNotification: function(message, type = 'info') {
        // Create notification element
        const notification = $('<div class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-lg shadow-lg text-white text-sm font-medium transition-all duration-300"></div>');
        
        // Set notification style based on type
        if (type === 'success') {
          notification.addClass('bg-green-500');
        } else if (type === 'error') {
          notification.addClass('bg-red-500');
        } else {
          notification.addClass('bg-blue-500');
        }
        
        notification.text(message);
        
        // Add to page
        $('body').append(notification);
        
        // Show notification
        setTimeout(() => {
          notification.addClass('opacity-100 translate-y-0');
        }, 100);
        
        // Hide and remove notification after 3 seconds
        setTimeout(() => {
          notification.addClass('opacity-0 -translate-y-2');
          setTimeout(() => {
            notification.remove();
          }, 300);
        }, 3000);
      }
    };
    
    // Initialize cache checking on page load
    $(document).ready(function() {
      // Check cache version on every page load
      window.cacheManager.checkCacheVersion();
    });
  </script>

    } else {

  }
});

});

  }
}, { passive: false });

<script>
$(document).ready(function() {
  // Fetch addresses primarily from addressesData (saved by address.php). Fallback to appData via universal.js
  let data = null;
  try { data = JSON.parse(localStorage.getItem('addressesData')); } catch(_) {}
  if (!data || !data.addresses) {
    try { data = JSON.parse(localStorage.getItem('appData')); } catch(_) {}
  }
  const list = (data && data.addresses && data.addresses.list) ? data.addresses.list : {};
  const keys = Object.keys(list);

  // Update header title count
  const headerTitle = document.querySelector('header .text-base.font-medium');
  if (headerTitle) {
    headerTitle.textContent = keys.length > 0 
      ? `Select Address (${keys.length})` 
      : 'Select Address';
  }


  const $container = $('#addressList');
  if (keys.length === 0) {
    $container.html('<div class="p-4 text-sm text-gray-600">No saved addresses. Add a new address.</div>');
    return;
  }

  const itemsHtml = keys.map((id, idx) => {
    const a = list[id] || {};
    const name = a.name || '';
    const badge = (a.type || '').toUpperCase();
    const addrLine = [a.house, a.road, a.city, a.state].filter(Boolean).join(', ') + (a.pincode ? ` - ${a.pincode}` : '');
    const phone = a.number || '';
    const checked = idx === 0 ? 'checked' : '';
    return `
      <div class=\"address-item border-b border-gray-200 py-4\" data-address-id=\"${id}\">
        <div class=\"flex items-start space-x-3 px-4\">
          <div class=\"mt-1\">
            <input type=\"radio\" id=\"address-${id}\" name=\"selectedAddress\" value=\"${id}\" ${checked} class=\"w-4 h-4 text-flip-blue border-gray-300 focus:ring-flip-blue\">
          </div>
          <div class=\"flex-1\">
            <div class=\"flex items-center justify-between\"> 
              <div class=\"flex items-center space-x-2\">
                <h3 class=\"text-sm font-medium text-gray-900\">${name}</h3>
                ${badge ? `<span class=\"bg-gray-600 text-white text-xs px-2 py-0.5 rounded\">${badge}</span>` : ''}
              </div>
              <button class=\"edit-btn text-flip-blue text-sm font-medium shadow-sm border border-gray-200 px-2 py-1 rounded\" onclick=\"editAddress('${id}')\">Edit</button> 
            </div>
            <p class=\"text-sm text-gray-600 mt-1\">${addrLine}</p>
            <p class=\"text-sm text-gray-500 mt-1\">${phone}</p>
          </div>
        </div>
      </div>`;
  }).join('');

  $container.html(itemsHtml);

  // Handle address selection
  $(document).on('change', 'input[name="selectedAddress"]', function() {
    const selectedAddressId = $(this).val();
    localStorage.setItem('selectedAddressId', selectedAddressId);
    $('.address-item').removeClass('selected');
    $(this).closest('.address-item').addClass('selected');
  });

  // Initialize selection: prefer previously saved id
  const savedSelected = localStorage.getItem('selectedAddressId');
  const initialId = (savedSelected && list[savedSelected]) ? savedSelected : keys[0];
  if (initialId) {
    $(`#address-${initialId}`).prop('checked', true);
    localStorage.setItem('selectedAddressId', initialId);
    $(`.address-item[data-address-id=\"${initialId}\"]`).addClass('selected');
  }
});

function addNewAddress() {
  window.location.href = 'address.php';
}

function editAddress(addressId) {
  window.location.href = `address.php?edit=${addressId}`;
}

function proceedToOrderSummary() {
  const selectedAddressId = $('input[name="selectedAddress"]:checked').val();
  if (!selectedAddressId) {
    alert('Please select an address');
    return;
  }
  localStorage.setItem('selectedAddressId', selectedAddressId);
  window.location.href = 'order-summary.php';
}
</script>
